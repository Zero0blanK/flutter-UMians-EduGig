name: student_freelance_services
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.9.0
  excel: ^4.0.6
  file_picker: ^12.2.0
  file_saver: ^0.4.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  go_router: ^18.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/login-bg.png

  fonts:
    # Headings. Bricolage Grotesque gives the app its voice: a grotesque with
    # enough quirk in the terminals to read as student-made rather than
    # enterprise. Kept to display sizes only.
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    # Everything else. Plus Jakarta Sans has open counters and a tall x-height,
    # which is what small UI text on a phone actually needs.
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
